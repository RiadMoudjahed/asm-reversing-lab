name: Translation
description: Improve or review a translation.
labels: ["i18n"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Arabic, German, Spanish, French, Other]
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or file
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
    validations:
      required: true
